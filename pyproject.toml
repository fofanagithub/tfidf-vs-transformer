[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tvt"
version = "1.0.0"
description = "Comparaison rigoureuse : Transformer fine-tuné vs baseline TF-IDF + régression logistique"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "transformers>=4.44",
    "datasets>=2.20",
    "accelerate>=0.33",
    "sentencepiece>=0.2",  # CamemBERT tokenizer
    "protobuf>=4.25",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
tvt = "tvt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
